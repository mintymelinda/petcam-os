services:
  image-assembly:
    image: petcam-image-assembly:local
    build:
      context: ..
      dockerfile: build/Dockerfile
    working_dir: /workspace
    privileged: true
    volumes:
      - ..:/workspace
      - /dev:/dev
      - /run/udev:/run/udev:ro
    environment:
      BASE_IMAGE_PATH: \${BASE_IMAGE_PATH:?Set BASE_IMAGE_PATH to the raw pi-gen image}
      OUTPUT_IMAGE_PATH: \${OUTPUT_IMAGE_PATH:?Set OUTPUT_IMAGE_PATH to the assembled image path}
      IMAGE_URL: \${IMAGE_URL:?Set IMAGE_URL to the published HTTPS image URL}
      RELEASE_VERSION: \${RELEASE_VERSION:?Set RELEASE_VERSION}
      IMAGE_SCHEMA_PATH: /workspace/.build/os-list-schema.json

name: Build PetCam OS image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config"
      - "VERSION"
      - "stage-petcam/**"
      - "tests/**"
      - "tools/**"
      - "assets/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/build-image.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "config"
      - "VERSION"
      - "stage-petcam/**"
      - "tests/**"
      - "tools/**"
      - "assets/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/build-image.yml"

concurrency:
  group: petcam-os-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out PetCam OS
        uses: actions/checkout@v7

      - name: Validate PetCam scripts
        run: |
          python3 -m py_compile stage-petcam/00-install-files/files/usr/local/lib/petcam/camera.py stage-petcam/00-install-files/files/usr/local/lib/petcam/csi_stream.py stage-petcam/00-install-files/files/usr/local/lib/petcam/web_manager.py stage-petcam/00-install-files/files/usr/local/lib/petcam/web_auth.py stage-petcam/00-install-files/files/usr/local/lib/petcam/health_monitor.py stage-petcam/00-install-files/files/usr/local/lib/petcam/config.py stage-petcam/00-install-files/files/usr/local/lib/petcam/network_diagnostics.py stage-petcam/00-install-files/files/usr/local/lib/petcam/factory_reset.py stage-petcam/00-install-files/files/usr/local/lib/petcam/camera_profiles.py stage-petcam/00-install-files/files/usr/local/lib/petcam/home_assistant.py stage-petcam/00-install-files/files/usr/local/lib/petcam/timelapse.py stage-petcam/00-install-files/files/usr/local/lib/petcam/motion_detection.py tools/create_imager_os_list.py stage-petcam/00-install-files/files/usr/local/lib/petcam/updater.py tools/create_update_release.py
          bash -n stage-petcam/00-install-files/00-run.sh stage-petcam/02-configure-petcam/00-run-chroot.sh tools/shrink_image.sh

      - name: Install test-only image processing dependency
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Test camera, updater, timelapse, motion detection, and Imager catalogue generation
        run: python3 -m unittest discover -s tests -v

  release:
    name: Build and publish release image
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Check out PetCam OS
        uses: actions/checkout@v7

      - name: Check out pi-gen
        uses: actions/checkout@v7
        with:
          repository: RPi-Distro/pi-gen
          ref: 6e3ff62bfd9c690a6a3d1d7de259d5e0af40cb78
          path: pi-gen

      - name: Add PetCam image stage
        run: |
          cp config pi-gen/config
          cp -a stage-petcam pi-gen/stage-petcam
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH; got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          printf '%s\n' "${RELEASE_VERSION}" > pi-gen/stage-petcam/00-install-files/files/usr/local/lib/petcam/VERSION
          touch pi-gen/stage2/SKIP_IMAGES
          chmod 0755 pi-gen/stage-petcam/prerun.sh
          chmod 0755 pi-gen/stage-petcam/00-install-files/00-run.sh
          mkdir -p pi-gen/deploy

      - name: Build Raspberry Pi OS image
        run: |
          cd pi-gen
          sudo ./build-docker.sh

      - name: Shrink and recompress the release image
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends parted e2fsprogs xz-utils
          mapfile -t IMAGES < <(find pi-gen/deploy -maxdepth 1 -type f -name '*.img.xz' -print)
          if [[ "${#IMAGES[@]}" -ne 1 ]]; then
            echo "Expected exactly one .img.xz image before shrinking; found ${#IMAGES[@]}." >&2
            exit 1
          fi
          bash tools/shrink_image.sh "${IMAGES[0]}"

      - name: Prepare and publish signed application update
        env:
          GH_TOKEN: ${{ github.token }}
          PETCAM_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.PETCAM_UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${PETCAM_UPDATE_SIGNING_PRIVATE_KEY}" ]]; then
            echo "Missing PETCAM_UPDATE_SIGNING_PRIVATE_KEY Actions secret; refusing to publish an unsigned update." >&2
            exit 1
          fi

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          KEY_FILE="${RUNNER_TEMP}/petcam-update-private.pem"
          DERIVED_PUBLIC_KEY="${RUNNER_TEMP}/petcam-update-public.pem"
          printf '%s\n' "${PETCAM_UPDATE_SIGNING_PRIVATE_KEY}" > "${KEY_FILE}"
          chmod 0600 "${KEY_FILE}"
          openssl pkey -in "${KEY_FILE}" -pubout -out "${DERIVED_PUBLIC_KEY}"
          if ! cmp -s "${DERIVED_PUBLIC_KEY}" stage-petcam/00-install-files/files/etc/petcam/update-signing.pub; then
            echo "The configured signing private key does not match the public key pinned in the Pi image." >&2
            exit 1
          fi

          mapfile -t IMAGES < <(find pi-gen/deploy -maxdepth 1 -type f -name '*.img.xz' -print)
          if [[ "${#IMAGES[@]}" -ne 1 ]]; then
            echo "Expected exactly one .img.xz image; found ${#IMAGES[@]}." >&2
            exit 1
          fi
          IMAGE_NAME="petcam-os-${TAG}.img.xz"
          cp "${IMAGES[0]}" "${IMAGE_NAME}"
          IMAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IMAGE_NAME}"
          python3 tools/create_imager_os_list.py "${IMAGE_NAME}" --image-url "${IMAGE_URL}"
          python3 -m pip install --disable-pip-version-check jsonschema
          curl --fail --silent --show-error https://raw.githubusercontent.com/raspberrypi/rpi-imager/main/doc/json-schema/os-list-schema.json -o os-list-schema.json
          python3 - <<'PY'
          import json
          from jsonschema import validate
          with open("os-list-schema.json", encoding="utf-8") as stream:
              schema = json.load(stream)
          with open("petcam-os-os-list.json", encoding="utf-8") as stream:
              catalogue = json.load(stream)
          validate(catalogue, schema)
          entry = catalogue["os_list"][0]
          assert entry["init_format"] == "cloudinit-rpi"
          assert entry["url"].startswith("https://")
          print("PetCam Imager OS sublist passed Raspberry Pi's published JSON schema.")
          PY

          RAW_IMAGE="${RUNNER_TEMP}/petcam-os.img"
          ROOTFS_MOUNT="${RUNNER_TEMP}/petcam-rootfs"
          RELEASE_DIR="${RUNNER_TEMP}/petcam-update-release"
          xz --decompress --stdout "${IMAGES[0]}" > "${RAW_IMAGE}"
          LOOP_DEVICE="$(sudo losetup --find --show --partscan "${RAW_IMAGE}")"
          cleanup() {
            sudo umount "${ROOTFS_MOUNT}" 2>/dev/null || true
            sudo losetup -d "${LOOP_DEVICE}" 2>/dev/null || true
            rm -f "${RAW_IMAGE}" "${KEY_FILE}" "${DERIVED_PUBLIC_KEY}"
          }
          trap cleanup EXIT
          sudo udevadm settle
          ROOT_PARTITION="${LOOP_DEVICE}p2"
          if [[ ! -b "${ROOT_PARTITION}" ]]; then
            echo "Could not locate the Raspberry Pi root filesystem partition (${ROOT_PARTITION})." >&2
            exit 1
          fi
          sudo mkdir -p "${ROOTFS_MOUNT}"
          sudo mount -o ro "${ROOT_PARTITION}" "${ROOTFS_MOUNT}"
          PACKAGE_INVENTORY="${RUNNER_TEMP}/${TAG}-installed-packages.tsv"
          sudo dpkg-query --admindir="${ROOTFS_MOUNT}/var/lib/dpkg" \
            --show --showformat='${binary:Package}\t${Version}\t${db:Status-Abbrev}\t${Installed-Size}\n' \
            | awk -F '\t' '$3 ~ /^ii/' \
            | sort -t 
          sudo chown -R "$(id -u):$(id -g)" "${RELEASE_DIR}"
          sudo umount "${ROOTFS_MOUNT}"

          ARCHIVE_NAME="petcam-${VERSION}-armhf.tar.gz"
          ARCHIVE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ARCHIVE_NAME}"
          python3 tools/create_update_release.py \
            --release-dir "${RELEASE_DIR}" \
            --version "${VERSION}" \
            --archive-url "${ARCHIVE_URL}" \
            --private-key "${KEY_FILE}" \
            --output-dir "${RUNNER_TEMP}/petcam-update-assets"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${IMAGE_NAME}" petcam-os-os-list.json \
              "${PACKAGE_INVENTORY}" "${RUNNER_TEMP}/${TAG}-build-info.txt" \
              "${RUNNER_TEMP}/petcam-update-assets/${ARCHIVE_NAME}" \
              "${RUNNER_TEMP}/petcam-update-assets/petcam-update-manifest.json" \
              "${RUNNER_TEMP}/petcam-update-assets/petcam-update-manifest.json.sig" --clobber
          else
            gh release create "${TAG}" "${IMAGE_NAME}" petcam-os-os-list.json \
              "${PACKAGE_INVENTORY}" "${RUNNER_TEMP}/${TAG}-build-info.txt" \
              "${RUNNER_TEMP}/petcam-update-assets/${ARCHIVE_NAME}" \
              "${RUNNER_TEMP}/petcam-update-assets/petcam-update-manifest.json" \
              "${RUNNER_TEMP}/petcam-update-assets/petcam-update-manifest.json.sig" \
              --title "PetCam OS ${VERSION}" --generate-notes
          fi
\t' -k4,4nr > "${PACKAGE_INVENTORY}"
          printf 'PetCam OS release: %s\npi-gen commit: %s\n\n' "${TAG}" \
            '6e3ff62bfd9c690a6a3d1d7de259d5e0af40cb78' > "${RUNNER_TEMP}/${TAG}-build-info.txt"
          sudo cp -a "${ROOTFS_MOUNT}/opt/petcam/releases/${VERSION}" "${RELEASE_DIR}"
          sudo chown -R "$(id -u):$(id -g)" "${RELEASE_DIR}"
          sudo umount "${ROOTFS_MOUNT}"

          ARCHIVE_NAME="petcam-${VERSION}-armhf.tar.gz"
          ARCHIVE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ARCHIVE_NAME}"
          python3 tools/create_update_release.py \
            --release-dir "${RELEASE_DIR}" \
            --version "${VERSION}" \
            --archive-url "${ARCHIVE_URL}" \
            --private-key "${KEY_FILE}" \
            --output-dir "${RUNNER_TEMP}/petcam-update-assets"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${IMAGE_NAME}" petcam-os-os-list.json \
              "${RUNNER_TEMP}/petcam-update-assets/${ARCHIVE_NAME}" \
              "${RUNNER_TEMP}/petcam-update-assets/petcam-update-manifest.json" \
              "${RUNNER_TEMP}/petcam-update-assets/petcam-update-manifest.json.sig" --clobber
          else
            gh release create "${TAG}" "${IMAGE_NAME}" petcam-os-os-list.json \
              "${RUNNER_TEMP}/petcam-update-assets/${ARCHIVE_NAME}" \
              "${RUNNER_TEMP}/petcam-update-assets/petcam-update-manifest.json" \
              "${RUNNER_TEMP}/petcam-update-assets/petcam-update-manifest.json.sig" \
              --title "PetCam OS ${VERSION}" --generate-notes
          fi

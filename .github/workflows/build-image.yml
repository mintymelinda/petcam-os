name: Build PetCam OS image

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Application version to embed in a manual benchmark image
        required: false
        default: "0.0.0"
        type: string
  pull_request:
    paths:
      - "config"
      - "VERSION"
      - "build/**"
      - "stage-petcam/**"
      - "stage-petcam-base/**"
      - "tests/**"
      - "tools/**"
      - "assets/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/build-image.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "config"
      - "VERSION"
      - "build/**"
      - "stage-petcam/**"
      - "stage-petcam-base/**"
      - "tests/**"
      - "tools/**"
      - "assets/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/build-image.yml"

concurrency:
  group: petcam-os-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out PetCam OS
        uses: actions/checkout@v7

      - name: Validate PetCam scripts
        run: |
          python3 -m py_compile \
            stage-petcam/00-install-files/files/usr/local/lib/petcam/camera.py \
            stage-petcam/00-install-files/files/usr/local/lib/petcam/csi_stream.py \
            stage-petcam/00-install-files/files/usr/local/lib/petcam/rtmp_output.py \
            stage-petcam/00-install-files/files/usr/local/lib/petcam/web_manager.py \
            stage-petcam/00-install-files/files/usr/local/lib/petcam/web_auth.py \
            stage-petcam/00-install-files/files/usr/local/lib/petcam/health_monitor.py \
            stage-petcam/00-install-files/files/usr/local/lib/petcam/config.py \
            stage-petcam/00-install-files/files/usr/local/lib/petcam/network_diagnostics.py \
            stage-petcam/00-install-files/files/usr/local/lib/petcam/wifi_metrics.py \
            stage-petcam/00-install-files/files/usr/local/lib/petcam/updater.py \
            stage-petcam/00-install-files/files/usr/local/lib/petcam/factory_reset.py \
            stage-petcam/00-install-files/files/usr/local/lib/petcam/home_assistant.py \
            stage-petcam/00-install-files/files/usr/local/lib/petcam/timelapse.py \
            stage-petcam/00-install-files/files/usr/local/lib/petcam/motion_detection.py \
            tools/create_imager_os_list.py tools/create_update_release.py \
            tools/assemble_image.py
          bash -n stage-petcam-base/prerun.sh stage-petcam/prerun.sh \
            stage-petcam/00-install-files/00-run.sh \
            stage-petcam/02-configure-petcam/00-run-chroot.sh \
            stage-petcam-base/02-build-ustreamer/00-run-chroot.sh
          diff -u build/apt-packages.txt stage-petcam-base/01-install-packages/00-packages

      - name: Install test-only image processing dependency
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Test camera, RTMP output, updater, timelapse, motion detection, and Imager catalogue generation
        run: python3 -m unittest discover -s tests -v

  build-image:
    name: Build Raspberry Pi OS image
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Check out PetCam OS
        uses: actions/checkout@v7

      - name: Resolve and validate application version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must be vMAJOR.MINOR.PATCH; got ${GITHUB_REF_NAME}." >&2
              exit 1
            fi
          else
            RELEASE_VERSION="${INPUT_VERSION:-0.0.0}"
          fi
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be MAJOR.MINOR.PATCH; got ${RELEASE_VERSION}." >&2
            exit 1
          fi
          printf '%s\n' "${RELEASE_VERSION}" > stage-petcam/00-install-files/files/usr/local/lib/petcam/VERSION
          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "${GITHUB_ENV}"

      - name: Prepare draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Reusing existing release ${TAG}."
          else
            gh release create "${TAG}" --draft --verify-tag \
              --title "PetCam OS ${VERSION}" --generate-notes
          fi

      # The pinned upstream pi-gen revision is the existing 32-bit/armhf target.
      # The ARM64 runner executes the build tooling natively without changing the
      # image architecture or dropping support for original Raspberry Pi Zero boards.
      - name: Build base Raspberry Pi OS
        id: pigen
        uses: usimd/pi-gen-action@v1.11.0
        with:
          image-name: PetCamOS
          stage-list: stage0 stage1 stage2
          release: trixie
          compression: none
          compression-level: 6
          hostname: petcam
          locale: en_CA.UTF-8
          timezone: America/Toronto
          keyboard-keymap: us
          keyboard-layout: English (US)
          enable-ssh: 1
          enable-cloud-init: 1
          pi-gen-version: 6e3ff62bfd9c690a6a3d1d7de259d5e0af40cb78
          export-last-stage-only: true
          enable-pigen-cache: false
          increase-runner-disk-size: true
          verbose-output: true

      - name: Upload pi-gen build logs
        if: always() && steps.pigen.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: pigen-build-logs-${{ github.run_id }}
          path: pi-gen/deploy/*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare post-pi-gen assembly inputs
        env:
          BASE_IMAGE_PATH: ${{ steps.pigen.outputs.image-path }}
          IMAGE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/petcam-os-${{ github.ref_name }}.img.xz
        run: |
          set -euo pipefail
          mkdir -p .build
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/raspberrypi/rpi-imager/main/doc/json-schema/os-list-schema.json \
            -o .build/os-list-schema.json
          BASE_IMAGE_PATH="${BASE_IMAGE_PATH#${GITHUB_WORKSPACE}/}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            OUTPUT_IMAGE_PATH="build/output/petcam-os-${GITHUB_REF_NAME}.img.xz"
          else
            OUTPUT_IMAGE_PATH="build/output/petcam-os-${RELEASE_VERSION}.img.xz"
            IMAGE_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          {
            echo "BASE_IMAGE_PATH=${BASE_IMAGE_PATH}"
            echo "OUTPUT_IMAGE_PATH=${OUTPUT_IMAGE_PATH}"
            echo "IMAGE_URL=${IMAGE_URL}"
          } >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx for native BuildKit caching
        uses: docker/setup-buildx-action@v3

      - name: Build post-pi-gen image assembly container with native layer caching
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          push: false
          load: true
          tags: petcam-image-assembly:local
          cache-from: type=gha,scope=petcam-image-assembly
          cache-to: type=gha,scope=petcam-image-validation,mode=max

      - name: Assemble PetCam and validate Imager catalogue
        run: docker compose --file build/compose.yaml run --rm --no-build image-assembly

      - name: Upload manually built image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: petcam-os-${{ steps.version.outputs.release_version }}
          path: |
            build/output/petcam-os-${{ steps.version.outputs.release_version }}.img.xz
            petcam-os-os-list.json
          if-no-files-found: error
          retention-days: 14

      - name: Prepare and publish signed application update
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          PETCAM_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.PETCAM_UPDATE_SIGNING_PRIVATE_KEY }}
          IMAGE_PATH: ${{ github.workspace }}/build/output/petcam-os-${{ github.ref_name }}.img.xz
        run: |
          set -euo pipefail
          if [[ -z "${PETCAM_UPDATE_SIGNING_PRIVATE_KEY}" ]]; then
            echo "Missing PETCAM_UPDATE_SIGNING_PRIVATE_KEY Actions secret; refusing to publish an unsigned update." >&2
            exit 1
          fi

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          KEY_FILE="${RUNNER_TEMP}/petcam-update-private.pem"
          DERIVED_PUBLIC_KEY="${RUNNER_TEMP}/petcam-update-public.pem"
          printf '%s\n' "${PETCAM_UPDATE_SIGNING_PRIVATE_KEY}" > "${KEY_FILE}"
          chmod 0600 "${KEY_FILE}"
          openssl pkey -in "${KEY_FILE}" -pubout -out "${DERIVED_PUBLIC_KEY}"
          if ! cmp -s "${DERIVED_PUBLIC_KEY}" stage-petcam/00-install-files/files/etc/petcam/update-signing.pub; then
            echo "The configured signing private key does not match the public key pinned in the Pi image." >&2
            exit 1
          fi

          if [[ ! -f "${IMAGE_PATH}" ]]; then
            echo "pi-gen action image output is missing: ${IMAGE_PATH}" >&2
            exit 1
          fi
          IMAGE_NAME="petcam-os-${TAG}.img.xz"
          cp "${IMAGE_PATH}" "${IMAGE_NAME}"

          RAW_IMAGE="${RUNNER_TEMP}/petcam-os.img"
          ROOTFS_MOUNT="${RUNNER_TEMP}/petcam-rootfs"
          RELEASE_DIR="${RUNNER_TEMP}/petcam-update-release"
          xz --decompress --stdout "${IMAGE_PATH}" > "${RAW_IMAGE}"
          LOOP_DEVICE="$(sudo losetup --find --show --partscan "${RAW_IMAGE}")"
          cleanup() {
            sudo umount "${ROOTFS_MOUNT}" 2>/dev/null || true
            sudo losetup -d "${LOOP_DEVICE}" 2>/dev/null || true
            rm -f "${RAW_IMAGE}" "${KEY_FILE}" "${DERIVED_PUBLIC_KEY}"
          }
          trap cleanup EXIT
          sudo udevadm settle
          ROOT_PARTITION="${LOOP_DEVICE}p2"
          if [[ ! -b "${ROOT_PARTITION}" ]]; then
            echo "Could not locate the Raspberry Pi root filesystem partition (${ROOT_PARTITION})." >&2
            exit 1
          fi
          sudo mkdir -p "${ROOTFS_MOUNT}"
          sudo mount -o ro "${ROOT_PARTITION}" "${ROOTFS_MOUNT}"
          PACKAGE_INVENTORY="${RUNNER_TEMP}/${TAG}-installed-packages.tsv"
          sudo dpkg-query --admindir="${ROOTFS_MOUNT}/var/lib/dpkg" \
            --show --showformat='${binary:Package}\t${Version}\t${db:Status-Abbrev}\t${Installed-Size}\n' \
            | awk -F '\t' '$3 ~ /^ii/' \
            | sort -k4,4nr > "${PACKAGE_INVENTORY}"
          printf 'PetCam OS release: %s\npi-gen commit: %s\n\n' "${TAG}" \
            '6e3ff62bfd9c690a6a3d1d7de259d5e0af40cb78' > "${RUNNER_TEMP}/${TAG}-build-info.txt"
          sudo cp -a "${ROOTFS_MOUNT}/opt/petcam/releases/${VERSION}" "${RELEASE_DIR}"
          sudo chown -R "$(id -u):$(id -g)" "${RELEASE_DIR}"
          sudo umount "${ROOTFS_MOUNT}"

          ARCHIVE_NAME="petcam-${VERSION}-armhf.tar.gz"
          ARCHIVE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ARCHIVE_NAME}"
          python3 tools/create_update_release.py \
            --release-dir "${RELEASE_DIR}" \
            --version "${VERSION}" \
            --archive-url "${ARCHIVE_URL}" \
            --private-key "${KEY_FILE}" \
            --output-dir "${RUNNER_TEMP}/petcam-update-assets"

          gh release upload "${TAG}" "${IMAGE_NAME}" petcam-os-os-list.json \
            "${PACKAGE_INVENTORY}" "${RUNNER_TEMP}/${TAG}-build-info.txt" \
            "${RUNNER_TEMP}/petcam-update-assets/${ARCHIVE_NAME}" \
            "${RUNNER_TEMP}/petcam-update-assets/petcam-update-manifest.json" \
            "${RUNNER_TEMP}/petcam-update-assets/petcam-update-manifest.json.sig" --clobber

          ASSETS="$(gh release view "${TAG}" --json assets --jq '[.assets[].name]')"
          for REQUIRED_ASSET in "${ARCHIVE_NAME}" "petcam-update-manifest.json" "petcam-update-manifest.json.sig"; do
            if ! jq -e --arg asset "${REQUIRED_ASSET}" 'index($asset) != null' <<<"${ASSETS}" >/dev/null; then
              echo "Release ${TAG} is missing required asset: ${REQUIRED_ASSET}" >&2
              exit 1
            fi
          done

          # Publish only after the updater archive, manifest, and signature exist.
          gh release edit "${TAG}" --draft=false

name: Build PetCam OS image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config"
      - "VERSION"
      - "stage-petcam/**"
      - "tests/**"
      - "tools/**"
      - "assets/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/build-image.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "config"
      - "VERSION"
      - "stage-petcam/**"
      - "tests/**"
      - "tools/**"
      - "assets/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/build-image.yml"

concurrency:
  group: petcam-os-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out PetCam OS
        uses: actions/checkout@v7

      - name: Validate PetCam scripts
        run: |
          python3 -m py_compile stage-petcam/00-install-files/files/usr/local/lib/petcam/camera.py stage-petcam/00-install-files/files/usr/local/lib/petcam/csi_stream.py stage-petcam/00-install-files/files/usr/local/lib/petcam/web_manager.py tools/create_imager_manifest.py tools/create_imager_os_list.py stage-petcam/00-install-files/files/usr/local/lib/petcam/updater.py
          bash -n stage-petcam/00-install-files/00-run.sh stage-petcam/02-configure-petcam/00-run-chroot.sh

      - name: Test camera and Imager catalogue generation
        run: python3 -m unittest discover -s tests -v

      - name: Check out pi-gen
        uses: actions/checkout@v7
        with:
          repository: RPi-Distro/pi-gen
          ref: master
          path: pi-gen

      - name: Add PetCam image stage
        run: |
          cp config pi-gen/config
          cp -a stage-petcam pi-gen/stage-petcam
          touch pi-gen/stage2/SKIP_IMAGES
          chmod 0755 pi-gen/stage-petcam/prerun.sh
          chmod 0755 pi-gen/stage-petcam/00-install-files/00-run.sh
          mkdir -p pi-gen/deploy

      - name: Build Raspberry Pi OS image
        run: |
          cd pi-gen
          sudo ./build-docker.sh

      - name: Upload image artifacts
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v7
        with:
          name: petcam-os-image
          path: pi-gen/deploy/*.img.xz
          if-no-files-found: error
          retention-days: 14

      - name: Prepare and publish release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          EXPECTED_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Tag $TAG does not match VERSION ($EXPECTED_VERSION)." >&2
            exit 1
          fi
          mapfile -t IMAGES < <(find pi-gen/deploy -maxdepth 1 -type f -name '*.img.xz' -print)
          if [[ "${#IMAGES[@]}" -ne 1 ]]; then
            echo "Expected exactly one .img.xz image; found ${#IMAGES[@]}." >&2
            exit 1
          fi
          IMAGE_NAME="petcam-os-${TAG}.img.xz"
          cp "${IMAGES[0]}" "$IMAGE_NAME"
          IMAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IMAGE_NAME}"
          python3 tools/create_imager_os_list.py "$IMAGE_NAME" --image-url "$IMAGE_URL" --version "$VERSION"
          python3 -m pip install --disable-pip-version-check jsonschema
          curl --fail --silent --show-error https://raw.githubusercontent.com/raspberrypi/rpi-imager/main/doc/json-schema/os-list-schema.json -o os-list-schema.json
          python3 - <<'PY'
          import json
          from jsonschema import validate
          with open("os-list-schema.json", encoding="utf-8") as stream:
              schema = json.load(stream)
          with open("petcam-os-os-list.json", encoding="utf-8") as stream:
              catalogue = json.load(stream)
          validate(catalogue, schema)
          entry = catalogue["os_list"][0]
          assert entry["init_format"] == "cloudinit-rpi"
          assert entry["url"].startswith("https://")
          print("PetCam Imager OS sublist passed Raspberry Pi's published JSON schema.")
          PY
          gh release create "$TAG" "$IMAGE_NAME" petcam-os-os-list.json --title "PetCam OS $VERSION" --generate-notes
    permissions:
      contents: write
